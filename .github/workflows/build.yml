name: build
on:
  push:
  pull_request:
  workflow_dispatch:

# Only superseded PR CI is cancelled; never cancel main, release or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('protected-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/run_tests.sh
      - name: Production DSP address and undefined behavior sanitizers
        shell: bash
        run: |
          for test in test_dsp test_smooth_tone test_rack_extensions; do
            g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Itests/stub -ISkellCore/include -ISource tests/$test.cpp -o /tmp/$test-sanitized
            /tmp/$test-sanitized
          done
      - run: python -m unittest discover -s tests -p test_moduleinfo.py -v

  plugin:
    needs: dsp-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Normalize and validate VST3 moduleinfo
        run: python tools/fix_vst3_moduleinfo.py build
      - name: Collect plugin
        shell: bash
        run: |
          mkdir -p out
          find build -maxdepth 6 -name "*.vst3" -exec cp -R {} out/ \;
          find build -maxdepth 6 -name "*.component" -exec cp -R {} out/ \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: SkellierRack-${{ matrix.os }}
          path: out

