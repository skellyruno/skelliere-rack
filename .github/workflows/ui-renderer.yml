name: Skelliere Rack / Real JUCE editor screenshot
on:
  push:
    branches: [main]
    paths: ['Source/**', 'assets/**', 'CMakeLists.txt', 'tools/SkelliereRackUiRendererMain.cpp', '.github/workflows/ui-renderer.yml']
  pull_request:
    paths: ['Source/**', 'assets/**', 'CMakeLists.txt', 'tools/SkelliereRackUiRendererMain.cpp', '.github/workflows/ui-renderer.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('protected-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshot-smoke:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure real Skelliere editor screenshot renderer
        run: cmake -S . -B build -A x64 -DSKELLIERE_BUILD_UI_RENDERER=ON
      - name: Compile actual-editor renderer
        run: cmake --build build --config Release --target SkelliereRackUIRenderer --parallel 2
      - name: Collect Windows editor test executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -File -Filter SkelliereRackUIRenderer.exe | Select-Object -First 1
          if (-not $exe) { throw 'Missing test executable' }
          New-Item -ItemType Directory -Force local-renderer | Out-Null
          Copy-Item $exe.FullName local-renderer/
      - uses: actions/upload-artifact@v4
        with:
          name: Skelliere-Local-Windows-Editor-Renderer
          path: local-renderer/
          if-no-files-found: error
      - name: Capture and validate artwork appearances
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -File -Filter SkelliereRackUIRenderer.exe | Select-Object -First 1
          if (-not $exe) { throw 'SkelliereRackUIRenderer.exe missing' }
          & $exe.FullName (Join-Path (Get-Location) 'ui-screenshots')
          if ($LASTEXITCODE -ne 0) { throw "Renderer failed: $LASTEXITCODE" }
          if (@(Get-ChildItem ui-screenshots -Filter *.png).Count -ne 19) { throw 'Expected nineteen real-editor screenshots' }
          if (-not (Test-Path ui-screenshots/manifest.json)) { throw 'Screenshot manifest missing' }
          $manifest = Get-Content ui-screenshots/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.count -ne 19) { throw 'Screenshot manifest count mismatch' }
          if (-not (Test-Path ui-screenshots/performance.csv)) { throw 'Missing UI/processor benchmark' }
      - name: Export actual editor evidence for connected review
        run: python tools/ci_editor_evidence.py ui-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: Skelliere-Rack-Real-UI-Screenshot
          path: ui-screenshots/*
          if-no-files-found: error
          retention-days: 14

