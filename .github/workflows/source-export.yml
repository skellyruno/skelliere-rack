name: Source handoff archive
on:
  pull_request:
    paths: ['.github/workflows/source-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83a05759a2c7cff6a3caf0b0f18116d30ac1362b
      - name: Package exact verified source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "83a05759a2c7cff6a3caf0b0f18116d30ac1362b"
          mkdir -p handoff
          git archive --format=zip --prefix=Skelliere-Rack/ HEAD -- . ':!assets/*.zip' > handoff/Skelliere-Rack-83a0575-source.zip
          unzip -t handoff/Skelliere-Rack-83a0575-source.zip
          sha256sum handoff/Skelliere-Rack-83a0575-source.zip > handoff/SHA256SUMS.txt
          git rev-parse HEAD > handoff/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Skelliere-83a0575-Source-Handoff
          path: handoff/
          if-no-files-found: error
          retention-days: 14
