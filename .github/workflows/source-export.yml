name: Source handoff archive
on:
  pull_request:
    paths: ['Source/**', 'tools/**', 'tests/**', 'SkellCore/**', 'CMakeLists.txt', '.github/workflows/source-export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package exact verified source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          mkdir -p handoff
          git archive --format=zip --prefix=Skelliere-Rack/ HEAD -- . ':!assets/*.zip' > handoff/Skelliere-Rack-source.zip
          unzip -t handoff/Skelliere-Rack-source.zip
          sha256sum handoff/Skelliere-Rack-source.zip > handoff/SHA256SUMS.txt
          git rev-parse HEAD > handoff/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Skelliere-Source-Handoff-${{ github.event.pull_request.head.sha || github.sha }}
          path: handoff/
          if-no-files-found: error
          retention-days: 14
